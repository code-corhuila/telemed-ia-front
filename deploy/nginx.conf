server {
    listen 80;
    server_name _;

    # Internal Docker DNS. Without this, nginx uses the system resolver
    # (which does not know the platform network) and `api-gateway` fails
    # to resolve → 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Proxy /api/* to the gateway.
    # -------------------------------------------------------------------------

    location /api/ {
        set $gateway http://api-gateway:80;
        proxy_pass $gateway;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id  $http_x_correlation_id;

        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Federation artifacts: never cache
    location ~* (remoteEntry\.json|federation\.manifest\.json)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed chunks: long cache
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}