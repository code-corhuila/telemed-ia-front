server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Federation artifacts must never be cached: they decide which portal version loads.
    location ~* (remoteEntry\.json|federation\.manifest\.json)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Long cache for hashed chunks produced by the Angular build.
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}