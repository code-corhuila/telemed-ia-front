<header class="topbar">
  <a class="brand" routerLink="/" aria-label="TeleMed IA, inicio">
    <img src="assets/images/logo.svg" alt="" width="34" height="34" />
    <span>TeleMed IA</span>
  </a>

  <nav aria-label="Principal">
    <a class="nav-link" routerLink="/auth/sign-in">Iniciar sesión</a>
    <a class="pill" routerLink="/auth/register">Crear cuenta</a>
  </nav>
</header>

<main>
  <div class="hero-bg">
    <section class="hero" aria-labelledby="hero-title">
      <div>
        <p class="tag"><span class="dot" aria-hidden="true"></span>Telemedicina con asistente de IA</p>
        <h1 id="hero-title">
          <span class="line"><span>Tu atención médica, </span></span>
          <span class="line"><span>más simple </span></span>
          <span class="line"><span>e inteligente.</span></span>
        </h1>
        <p class="lede">
          Cuéntale tus síntomas a nuestro asistente antes de la consulta. Él organiza la información, tu médico la
          recibe lista y tú agendas sin esperas.
        </p>
      </div>

      <figure class="hero-photo">
        <img
          src="assets/images/hero-medical.png"
          alt="Profesional de la salud atendiendo a una paciente con una tableta"
          width="641"
          height="487"
        />
      </figure>
    </section>
  </div>
</main>
