<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand__icon">
        <img
          src="/assets/images/logo.svg"
          alt="TeleMed IA"
        />
      </div>

      <div class="brand__text">
        <strong>TeleMed IA</strong>
        <span>Salud inteligente</span>
      </div>
    </div>

    <nav
      class="sidebar__nav"
      aria-label="Navegación principal"
    >
      <a
        class="nav-item"
        routerLink="/dashboard"
        routerLinkActive="nav-item--active"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ⌂
        </span>

        <span>Inicio</span>
      </a>

      <span
        class="nav-item nav-item--disabled"
        aria-disabled="true"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ▣
        </span>

        <span>Mis citas</span>
      </span>

      <span
        class="nav-item nav-item--disabled"
        aria-disabled="true"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ＋
        </span>

        <span>Agendar cita</span>
      </span>

      <a
        class="nav-item"
        routerLink="/agent"
        routerLinkActive="nav-item--active"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ✦
        </span>

        <span>Preconsulta IA</span>
      </a>

      <span
        class="nav-item nav-item--disabled"
        aria-disabled="true"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ◷
        </span>

        <span>Historial</span>
      </span>

      <a
        class="nav-item"
        routerLink="/documents"
        routerLinkActive="nav-item--active"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ⎙
        </span>

        <span>Documentos</span>
      </a>

      <a
        class="nav-item"
        routerLink="/patient/profile"
        routerLinkActive="nav-item--active"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ♙
        </span>

        <span>Mi perfil</span>
      </a>

      <span
        class="nav-item nav-item--disabled"
        aria-disabled="true"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ♢
        </span>

        <span>Notificaciones</span>
      </span>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar-user">
        <div
          class="avatar avatar--sidebar"
          aria-hidden="true"
        >
          P
        </div>

        <div class="sidebar-user__info">
          <strong>Paciente</strong>
          <span>Cuenta de paciente</span>
        </div>
      </div>

      <button
        class="sign-out"
        type="button"
        (click)="signOut()"
      >
        <span aria-hidden="true">↪</span>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <section class="workspace">
    <main
      class="shell-main"
      [class.shell-main--agent]="isAgentRoute()"
    >
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
