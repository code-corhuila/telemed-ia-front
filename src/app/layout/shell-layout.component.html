<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div
        class="brand__icon"
        aria-hidden="true"
      >
        ✚
      </div>

      <div class="brand__text">
        <strong>TeleMed IA</strong>
        <span>Salud inteligente</span>
      </div>
    </div>

    <nav
      class="sidebar__nav"
      aria-label="Navegación principal"
    >
      <span
        class="nav-item nav-item--disabled"
        aria-disabled="true"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ⌂
        </span>

        <span>Inicio</span>
      </span>

      <span
        class="nav-item nav-item--disabled"
        aria-disabled="true"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ▣
        </span>

        <span>Mis citas</span>
      </span>

      <a
        class="nav-item"
        routerLink="/agent"
        routerLinkActive="nav-item--active"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ✦
        </span>

        <span>Asistente IA</span>
      </a>

      <span
        class="nav-item nav-item--disabled"
        aria-disabled="true"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ◷
        </span>

        <span>Historial</span>
      </span>

      <a
        class="nav-item"
        routerLink="/patient/profile"
        routerLinkActive="nav-item--active"
      >
        <span
          class="nav-item__icon"
          aria-hidden="true"
        >
          ♙
        </span>

        <span>Mi perfil</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar-user">
        <div
          class="avatar avatar--sidebar"
          aria-hidden="true"
        >
          P
        </div>

        <div class="sidebar-user__info">
          <strong>Paciente</strong>
          <span>Cuenta de paciente</span>
        </div>
      </div>

      <button
        class="sign-out"
        type="button"
        (click)="signOut()"
      >
        <span aria-hidden="true">↪</span>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <section class="workspace">
    @if (!isAgentRoute()) {
      <header class="topbar">
        <label class="search">
          <span
            class="search__icon"
            aria-hidden="true"
          >
            ⌕
          </span>

          <input
            type="search"
            placeholder="Buscar..."
            aria-label="Buscar"
          />
        </label>

        <div class="topbar__actions">
          <button
            class="icon-button"
            type="button"
            aria-label="Notificaciones"
            title="Notificaciones"
          >
            ♢
          </button>
        </div>
      </header>
    }

    <main
      class="shell-main"
      [class.shell-main--agent]="isAgentRoute()"
    >
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
